# Servicios de desarrollo local de SisLab
# Puertos no estándar (5433/6380) para no chocar con otros proyectos
services:
  postgres:
    image: postgres:16-alpine
    container_name: sislab-postgres
    environment:
      POSTGRES_USER: sislab
      POSTGRES_PASSWORD: sislab
      POSTGRES_DB: sislab_dev
    ports:
      - "5433:5432"
    volumes:
      - sislab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sislab -d sislab_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sislab-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sislab-pgdata:
